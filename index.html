<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A Surprise for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Caveat:wght@600;700&family=Yellowtail&family=Charmonman:wght@400;700&family=Itim&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=164" />
<!-- the background + the two biggest step images: fetched up front so they're
     already cached by the time their step appears, instead of popping in late.
     The number/*.png digits are preloaded from app.js (see preloadDigits). -->
<link rel="preload" as="image" href="assets/bg/image/paper-2.webp" />
<link rel="preload" as="image" href="assets/stickers/pin-slot.webp" />
<link rel="preload" as="image" href="assets/stickers/letter/close.webp" />
<link rel="preload" as="image" href="assets/stickers/letter/back.webp" />
<link rel="preload" as="image" href="assets/stickers/letter/front.webp" />
</head>
<body>
<!-- background music, lives outside #app so it survives every step change — see startBgMusic() in app.js -->
<div id="bg-music"></div>
<div id="app">
  <div class="progress-dots" id="progress-dots"></div>

  <!-- Step 1: Scan & Open -->
  <section class="step" data-step="1">
    <!-- Cover rebuild: a sealed envelope drawn in CSS (flap + wax seal), with
         the two flower stickers tucked behind it. The whole envelope is the
         "open" trigger; the flap lifts on hover/press so it reads as openable. -->
    <div class="cover" data-action="open">
      <!-- <p class="script script-hero cover-title">ถึงเธอ <span class="icon-heart"></span></p> -->
      <!-- Envelope rebuild: two photographed-paper PNGs (closed/open) cross-
           fade on tap instead of a CSS 3D flap-fold — a flat photo can't be
           folded convincingly, so the "opening" is a fade + the letter
           rising up from behind the open envelope's pocket notch. -->
      <div class="envelope">
        <img class="env-img env-closed" src="assets/stickers/letter/close.webp" alt="ซองจดหมาย" />
        <img class="env-img env-back" src="assets/stickers/letter/back.webp" alt="" />
        <span class="env-letter" data-action="next">
          <img class="env-letter-paper" src="assets/stickers/letter/letter-paper.webp" alt="" />
        </span>
        <img class="env-img env-front" src="assets/stickers/letter/front.webp" alt="ซองจดหมายเปิด" />
      </div>
      <!-- sibling of .envelope, not a child of it — .envelope is rotated for
           a hand-placed look, and being inside it made this tilt along with
           it. Pinned to .cover's own top-right corner instead, upright. -->
      <!-- hidden for now per request — remove `hidden` to bring it back -->
      <span class="click-letters cover-hint" hidden>
        <img src="assets/alphabet/C.webp" alt="C" />
        <img src="assets/alphabet/L.webp" alt="L" />
        <img src="assets/alphabet/i.webp" alt="I" />
        <img src="assets/alphabet/C.webp" alt="C" />
        <img src="assets/alphabet/K.webp" alt="K" />
      </span>
      <!-- points straight down at the envelope, bounces to draw the eye -->
      <div class="cover-open-hint">
        <span class="cover-open-text script">เปิดเลย</span>
      </div>
    </div>
  </section>

  <!-- Step 2: Unlock Mission -->
  <section class="step" data-step="2">
    <div class="card">
      <div class="pin-inputs" id="mission-pin">
        <img class="step2-unlock-img" src="assets/alphabet/unlock.webp" alt="unlock" />
        <span class="pin-slot"><input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" /><img class="pin-digit-img" alt="" /></span>
        <span class="pin-slot"><input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" /><img class="pin-digit-img" alt="" /></span>
        <span class="pin-slot"><input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" /><img class="pin-digit-img" alt="" /></span>
        <span class="pin-slot"><input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" /><img class="pin-digit-img" alt="" /></span>
        <span class="pin-slot"><input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" /><img class="pin-digit-img" alt="" /></span>
        <span class="pin-slot"><input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" /><img class="pin-digit-img" alt="" /></span>
        <p class="pin-slot-tip">tip: วันอะไรน้า</p>
      </div>
      <p class="toast" id="mission-error" hidden>ลองอีกครั้งนะ</p>
      <p class="toast toast-success" id="mission-success" hidden>ถูกต้อง <span class="icon-heart"></span></p>
    </div>
  </section>

  <!-- Step 3: Chat — a conversation in the shape of a messaging app. The
       sender's lines arrive on their own after a typing indicator; the
       recipient's turn is a row of replies to tap, and the one she taps
       becomes her own bubble. The replies are feelings, not facts — none is
       "right" and none changes what comes next (see CONTEXT.md). The last
       reply in the script doubles as the advance, so there is no separate
       "ไปต่อ" button. See startChat() in app.js. Hands off straight into the
       quiz (step 4) — journey/camera now come after the quiz instead of before. -->
  <section class="step" data-step="3">
    <div class="chat-scroll" id="chat-scroll">
      <div class="chat-log" id="chat-log"></div>
      <div class="chat-typing" id="chat-typing" hidden><span></span><span></span><span></span></div>
    </div>
    <div class="chat-options" id="chat-options"></div>
  </section>

  <!-- Step 5: no card, no button — just a line of text that fades in and
       out, then auto-advances into the Memory Gallery/camera (Step 6).
       See runJourneyText() in app.js. -->
  <section class="step" data-step="5">
    <p class="journey-text">ไปถ่ายรูปกัน</p>
  </section>

  <!-- Step 6: Memory Gallery -->
  <!-- no card background here on purpose — camera + photo pile sit directly
       on the page background; tapping the pile itself is the "next" action,
       so there's no separate button either -->
  <section class="step center" data-step="6">
    <!-- <p class="eyebrow">ถ่ายรูปกันน</p> -->
    <h2 class="script">ยิ้มหน่อยยย </h2>
    <p class="relationship-label" id="relationship-label"></p>
    <!-- The camera is drawn in CSS (no image asset) — see .cam-* rules in
         style.css. Every part is a positioned div sized in % of .cam, so the
         whole thing scales by changing .camera-frame's width alone. -->
    <button class="camera-frame" id="camera-trigger" data-action="reveal-photos" aria-label="ถ่ายรูป">
      <span class="cam">
        <span class="cam-top">
          <span class="cam-flash-unit"></span>
          <span class="cam-lens"><span class="cam-lens-mid"><span class="cam-lens-glass"></span></span></span>
          <!-- the flash lives inside the top-right box, so it blinks there -->
          <span class="cam-viewfinder"><span class="flash" id="camera-flash"></span></span>
          <span class="cam-slider-knob"></span>
          <span class="cam-shutter"></span>
        </span>
        <span class="cam-bottom">
          <span class="cam-handle"></span>
          <span class="cam-eject"></span>
          <span class="cam-rainbow"></span>
        </span>
      </span>
      <!-- curved motion arrow top-left + a few small stars scattered around
           the camera, all jiggling on the same beat as the camera itself -->
      <span class="cam-fx" aria-hidden="true">
        <img class="cam-arrow" src="assets/stickers/arrow.webp" alt="" />
        <i class="cam-star cam-star-1">✦</i>
        <i class="cam-star cam-star-2">✦</i>
        <i class="cam-star cam-star-3">✦</i>
      </span>
    </button>
    <div class="photo-stack" id="photo-stack" data-action="open-photo-modal"></div>
    <button class="btn-transparent" id="gallery-continue" data-action="next" hidden>ไปต่อ</button>
  </section>

  <!-- Step 6's photo viewer — opens once the camera pile is complete (see
       openPhotoModal() in app.js). Tapping a card sends it to the back of
       the stack so the next one shows; loops indefinitely. -->
  <div class="photo-modal" id="photo-modal" hidden>
    <button class="modal-close" id="photo-modal-close" aria-label="close">×</button>
    <div class="photo-modal-stack" id="photo-modal-stack"></div>
  </div>

  <!-- Step 4: Question — a short quiz right after the chat, always
       "winnable" (no fail state, see CONTEXT.md's mini-game decision).
       Tapping any option just advances to the next question. See
       renderQuestion()/answerQuestion() in app.js. -->
  <section class="step" data-step="4">
    <img class="q-sticker q-sticker-mark" src="assets/stickers/question/question1.webp" alt="" />
    <img class="q-sticker q-sticker-heart" src="assets/stickers/question/question3.webp" alt="" loading="lazy" />
    <div class="card">
      <img class="q-card-flower" src="assets/stickers/question/question2.webp" alt="" />
      <p class="eyebrow" id="question-progress"></p>
      <h2 class="script" id="question-text"></h2>
      <div class="quiz-options" id="question-options"></div>
    </div>
  </section>

  <!-- Voice Message — paused for now, kept for later re-enable, not part of the active flow -->
  <!--
  <section class="step" data-step="voice">
    <div class="card center">
      <p class="eyebrow">ข้อความเสียง</p>
      <h2 class="script" id="voice-from"></h2>
      <audio controls id="voice-player"></audio>
      <button class="btn-primary" data-action="next">ต่อไป</button>
    </div>
  </section>
  -->

  <!-- Step 7: The notebook — the scrapbook page and the timeline merged into
       one screen. The paper (grid lines + spiral binding) is drawn on the
       scroller with background-attachment: local, so it scrolls along with the
       entries — one long sheet moving past the window. Scrolling stays inside
       .spread-scroll because html/body lock scrolling site-wide. Roughly three entries fill the page, the rest
       come in on scroll. Entries are DATA.timeline, each paired with the photo
       of the same index from DATA.photos. See renderSpread() in app.js. -->
  <!-- <section class="step" data-step="7">
    <div class="spread" id="spread">
      <div class="spread-scroll" id="spread-scroll">
        <div class="sp-collage">
          <div class="sp-col sp-col-left">
            <span class="sp-love-hearts">♡ ♡ ♡</span>
            <img class="sp-love-title" src="assets/stickers/love.webp" alt="love" />
            <span class="sp-tag">หน้าตี๋ๆ</span>
            <span class="sp-tag">หัวเราะดัง</span>
            <span class="sp-tag">ความทรงจำที่ชอบสุด</span>
            <span class="sp-doodle-star">★</span>
            <span class="sp-doodle-heart">♥</span>
            <div class="sp-sticky">
              <p>ทำให้ทุกวันดีขึ้น 10 เท่า<br>ขอบคุณที่เป็นคนพิเศษของเรานะ ♥</p>
            </div>
            <div class="sp-ticket">

              <small>ทริปของเรา ♥</small>
            </div>
            <div class="sp-tag-label">เธอ + ฉัน<br>= magic</div>
          </div>

          <div class="sp-col sp-col-mid">
            <div class="sp-booth">
              <span class="sp-tape sp-booth-tape"></span>
              <p class="sp-booth-label">LOVE BUG ♥</p>
              <div class="sp-booth-frame"><img class="sp-img empty" alt="" /></div>
              <div class="sp-booth-frame"><img class="sp-img empty" alt="" /></div>
              <div class="sp-booth-frame"><img class="sp-img empty" alt="" /></div>
              <div class="sp-booth-frame"><img class="sp-img empty" alt="" /></div>

            </div>

          </div>

          <div class="sp-col sp-col-right">

            <span class="sp-doodle-star">★</span>
            <div class="sp-note-scrap">
              <span class="sp-tape sp-note-tape"></span>
              เธอคือแค่คู่หูสายฮาที่ใช่ที่สุด ♥
            </div>
            <span class="sp-doodle-heart">♥</span>
            <div class="sp-bubble">เธอคือแจ้งเตือนที่ชอบที่สุดของเรา ♥</div>
          </div>
        </div>
        <p class="sp-heading">เรื่องราวของเรา</p>
        <div class="sp-entries" id="spread-entries"></div>
        <button class="btn-transparent spread-continue" data-action="next">ไปต่อ</button>
      </div>
    </div>
  </section> -->

  <!-- Step 8: Photo Collage — overlapping tilted prints with the closing
       message handwritten across them, each line on its own white band.
       See renderCollageEnd() in app.js. The paper-and-calendar layout that
       came before it is kept below but hidden — see CONTEXT.md "Step 8 ending
       is a Photo Collage". -->
  <section class="step scrapbook-end" data-step="7">
    <!-- .pb-canvas: one fixed-ratio canvas that always fits inside the
         viewport, with every piece positioned in % of IT and sized in cqw, and
         a gutter so a rotated piece can't swing out past #app (which clips
         overflow). Same trick as Step 6's camera. Shared by both layouts. -->
    <div class="pb-canvas">
      <div class="pc-photo pc-photo-1"><img id="pc-img-1" alt="" loading="lazy" /></div>
      <div class="pc-photo pc-photo-2"><img id="pc-img-2" alt="" loading="lazy" /></div>
      <div class="pc-photo pc-photo-3"><img id="pc-img-3" alt="" loading="lazy" /></div>
      <div class="pc-photo pc-photo-4"><img id="pc-img-4" alt="" loading="lazy" /></div>

      <!-- the white band behind each line comes from box-decoration-break on
           an inline span, so it follows however the text happens to wrap -->
      <p class="pc-hand pc-note"><span id="pc-message"></span></p>
      <p class="pc-hand pc-date"><span id="pc-date"></span></p>
    </div>

    <!-- Previous layout (ruled sheet + photo-booth strip + month calendar),
         kept per request but not shown. renderClosingScrapbook() in app.js is
         no longer called; drop the `hidden` and swap the call back to bring it
         and its .pb-* rules in style.css back to life. -->
    <div class="pb-canvas" hidden>
    <!-- the big ruled sheet everything else is layered onto -->
    <div class="pb-note">
      <span class="pb-tape pb-tape-note"></span>
      <span class="pb-punch"></span><span class="pb-punch"></span><span class="pb-punch"></span>
      <h2 class="pb-happy">Happy <span class="pb-heart-solid"></span></h2>
      <span class="pb-heart-doodle"></span>
    </div>

    <!-- photo-booth strip: scalloped both edges, captioned top and bottom -->
    <div class="pb-strip">
      <p class="pb-strip-top">A Box Of Memories</p>
      <div class="pb-shot"><img class="pb-img" id="pb-img-1" alt="" loading="lazy" /></div>
      <div class="pb-shot"><img class="pb-img" id="pb-img-2" alt="" loading="lazy" /></div>
      <div class="pb-shot"><img class="pb-img" id="pb-img-3" alt="" loading="lazy" /></div>
      <p class="pb-strip-bottom">Ourbox</p>
    </div>
    <span class="pb-heart-solid pb-heart-strip"></span>

    <!-- month grid, the met-date circled — filled by renderClosingScrapbook() -->
    <div class="pb-calendar">
      <span class="pb-tape pb-tape-cal"></span>
      <span class="pb-cal-year" id="pb-cal-year"></span>
      <span class="pb-cal-month" id="pb-cal-month"></span>
      <div class="pb-cal-grid" id="pb-cal-grid"></div>
    </div>

    <img class="pb-flower" src="assets/stickers/flower/1.webp" alt="" loading="lazy" />

    <div class="pb-message">
      <span class="pb-clip"></span>
      <p class="pb-message-text" id="pb-message"></p>
    </div>
    </div>
  </section>

</div>

<script src="js/data.js?v=19"></script><script src="js/app.js?v=36"></script>
</body>
</html>
