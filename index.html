<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A Surprise for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Caveat:wght@600;700&family=Sriracha&family=Yellowtail&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=37" />
<!-- the background + the two biggest step images: fetched up front so they're
     already cached by the time their step appears, instead of popping in late.
     The number/*.png digits are preloaded from app.js (see preloadDigits). -->
<link rel="preload" as="image" href="assets/bg/paper-2.webp" />
<link rel="preload" as="image" href="assets/stickers/pin-slot.webp" />
</head>
<body>
<!-- background music, lives outside #app so it survives every step change — see startBgMusic() in app.js -->
<div id="bg-music"></div>
<div id="app">
  <div class="progress-dots" id="progress-dots"></div>

  <!-- Step 1: Scan & Open -->
  <section class="step" data-step="1">
    <div class="card center notepad" data-action="open">
      <p class="script script-hero step1-subtitle">วันนี้มีอะไร<br>จะบอกด้วยหล่ะ <span class="icon-heart"></span></p>
      <p class="hint step1-hint">
        <span class="click-letters">
          <img src="assets/alphabet/C.webp" alt="C" />
          <img src="assets/alphabet/L.webp" alt="L" />
          <img src="assets/alphabet/i.webp" alt="I" />
          <img src="assets/alphabet/C.webp" alt="C" />
          <img src="assets/alphabet/K.webp" alt="K" />
        </span>
      </p>
    </div>
  </section>

  <!-- Step 2: Unlock Mission -->
  <section class="step" data-step="2">
    <div class="card">
      <div class="pin-inputs" id="mission-pin">
        <img class="step2-unlock-img" src="assets/alphabet/unlock.webp" alt="unlock" />
        <span class="pin-slot"><input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" /><img class="pin-digit-img" alt="" /></span>
        <span class="pin-slot"><input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" /><img class="pin-digit-img" alt="" /></span>
        <span class="pin-slot"><input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" /><img class="pin-digit-img" alt="" /></span>
        <span class="pin-slot"><input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" /><img class="pin-digit-img" alt="" /></span>
        <span class="pin-slot"><input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" /><img class="pin-digit-img" alt="" /></span>
        <span class="pin-slot"><input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" /><img class="pin-digit-img" alt="" /></span>
        <p class="pin-slot-tip">tip: วันอะไรน้า</p>
      </div>
      <p class="toast" id="mission-error" hidden>ลองอีกครั้งนะ</p>
      <p class="toast toast-success" id="mission-success" hidden>ถูกต้อง <span class="icon-heart"></span></p>
    </div>
  </section>

  <!-- Step 3: Question — a few quiz questions before the camera, always
       "winnable" (no fail state, see CONTEXT.md's mini-game decision).
       Tapping any option just advances to the next question. See
       renderQuestion()/answerQuestion() in app.js. -->
  <section class="step" data-step="3">
    <div class="card">
      <p class="eyebrow" id="question-progress"></p>
      <h2 class="script" id="question-text"></h2>
      <div class="quiz-options" id="question-options"></div>
    </div>
  </section>

  <!-- Step 4: no card, no button — just a line of text that fades in and
       out, then auto-advances into the Memory Gallery/camera (Step 5).
       See runJourneyText() in app.js. -->
  <section class="step" data-step="4">
    <p class="journey-text">ไปถ่ายรูปกัน</p>
  </section>

  <!-- Step 5: Memory Gallery -->
  <!-- no card background here on purpose — camera + photo pile sit directly
       on the page background; tapping the pile itself is the "next" action,
       so there's no separate button either -->
  <section class="step center" data-step="5">
    <p class="eyebrow">ความทรงจำของเรา</p>
    <h2 class="script">ความทรงจำ</h2>
    <p class="relationship-label" id="relationship-label"></p>
    <!-- The camera is drawn in CSS (no image asset) — see .cam-* rules in
         style.css. Every part is a positioned div sized in % of .cam, so the
         whole thing scales by changing .camera-frame's width alone. -->
    <button class="camera-frame" id="camera-trigger" data-action="reveal-photos" aria-label="ถ่ายรูป">
      <span class="cam">
        <span class="cam-top">
          <span class="cam-flash-unit"></span>
          <span class="cam-lens"><span class="cam-lens-mid"><span class="cam-lens-glass"></span></span></span>
          <!-- the flash lives inside the top-right box, so it blinks there -->
          <span class="cam-viewfinder"><span class="flash" id="camera-flash"></span></span>
          <span class="cam-slider-knob"></span>
          <span class="cam-shutter"></span>
        </span>
        <span class="cam-bottom">
          <span class="cam-handle"></span>
          <span class="cam-eject"></span>
          <span class="cam-rainbow"></span>
        </span>
      </span>
    </button>
    <div class="photo-stack" id="photo-stack" data-action="open-photo-modal"></div>
    <button class="btn-transparent" id="gallery-continue" data-action="next" hidden>ไปต่อ</button>
  </section>

  <!-- Step 4's photo viewer — opens once the camera pile is complete (see
       openPhotoModal() in app.js). Tapping a card sends it to the back of
       the stack so the next one shows; loops indefinitely. -->
  <div class="photo-modal" id="photo-modal" hidden>
    <button class="modal-close" id="photo-modal-close" aria-label="close">×</button>
    <div class="photo-modal-stack" id="photo-modal-stack"></div>
  </div>

  <!-- Voice Message — paused for now, kept for later re-enable, not part of the active flow -->
  <!--
  <section class="step" data-step="voice">
    <div class="card center">
      <p class="eyebrow">ข้อความเสียง</p>
      <h2 class="script" id="voice-from"></h2>
      <audio controls id="voice-player"></audio>
      <button class="btn-primary" data-action="next">ต่อไป</button>
    </div>
  </section>
  -->

  <!-- Step 6: Scrapbook spread — a notebook-page photo collage, modelled on
       the moodboard the user supplied (grid paper, spiral binding, taped
       polaroids, cut-out text strips). Photos come from DATA.photos via
       renderSpread(); the strip/dictionary text comes from DATA.spread.
       Every piece is placed by hand in style.css (.sp-* rules) — the flow has
       no page scroll, so the collage is sized to fit the viewport, not to
       grow. -->
  <section class="step" data-step="6">
    <div class="spread" id="spread">
      <span class="sp-spiral"></span>

      <!-- three polaroids, zigzagging left-right down the page -->
      <div class="sp-item sp-frame sp-polaroid sp-p0"><span class="sp-clip"></span><img class="sp-img" data-photo="0" alt="" /></div>
      <div class="sp-item sp-frame sp-polaroid sp-p1"><span class="sp-tape sp-tape-a"></span><img class="sp-img" data-photo="1" alt="" /></div>
      <div class="sp-item sp-frame sp-polaroid sp-p2"><span class="sp-tape sp-tape-b"></span><img class="sp-img" data-photo="2" alt="" /></div>

      <img class="sp-flower" src="assets/stickers/flower/1.webp" alt="" />
      <span class="sp-heart sp-heart-1 icon-heart"></span>
      <span class="sp-heart sp-heart-2 icon-heart"></span>

      <div class="sp-item sp-dict sp-dict-1">
        <b id="spread-dict-word"></b>
        <span id="spread-dict-note"></span>
      </div>

      <div class="sp-item sp-strip sp-strip-1" id="spread-strip-1"></div>
      <div class="sp-item sp-strip dark sp-strip-2" id="spread-strip-2"></div>

      <span class="sp-item sp-lace sp-lace-1"></span>
    </div>
    <button class="btn-transparent spread-continue" data-action="next">ไปต่อ</button>
  </section>

  <!-- Step 7: The Letter — the closing scrapbook spread. Layered paper +
       washi tape around a handwritten note, per the love-scrapbook asset
       rules (reuse existing PNGs, build depth, no flat layout).
       ponytail: decoration is deliberately sparse right now — the user is
       preparing new sticker assets; drop them into .scrapbook as more
       .sb-deco elements and give each one a position rule. -->
  <section class="step" data-step="7">
    <div class="scrapbook">
      <!-- floating decorations, layered behind/around the note -->
      <img class="sb-deco sb-deco-flower1" src="assets/stickers/flower/1.webp" alt="" />
      <img class="sb-deco sb-deco-flower2" src="assets/stickers/flower/2.webp" alt="" />

      <!-- the note itself: torn-paper page, taped down, handwritten -->
      <div class="sb-paper">
        <span class="sb-tape sb-tape-tl"></span>
        <span class="sb-tape sb-tape-br"></span>
        <span class="sb-tape sb-tape-top"></span>
        <!-- label sticker straddling the paper's edge, like a real cutout -->
        <img class="sb-label" src="assets/stickers/favorite-person.webp" alt="" />
        <p class="sb-eyebrow">คำในใจที่อยากบอก</p>
        <div class="letter" id="letter-body"></div>
      </div>

      <!-- closing line on its own little card, tucked under the page corner.
           The corner marks are CSS, the way photo corners hold a print. -->
      <div class="sb-note">
        <span class="sb-corner sb-corner-tl"></span>
        <span class="sb-corner sb-corner-br"></span>
        <p class="sb-note-text" id="ending-message"></p>
      </div>

      <img class="sb-deco sb-deco-happy" src="assets/stickers/happy-place.webp" alt="" />
    </div>
  </section>

</div>

<script src="js/data.js?v=10"></script><script src="js/app.js?v=13"></script>
</body>
</html>
